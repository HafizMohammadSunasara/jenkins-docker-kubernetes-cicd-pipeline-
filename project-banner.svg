  <text x="125" y="122" fill="#E7C679" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">CLOUD &amp; DEVOPS PORTFOLIO  /  PROJECT 01</text>
  <text x="125" y="214" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800">END-TO-END CI/CD</text>
  <text x="125" y="278" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="45" font-weight="600">Jenkins  ·  Docker  ·  Kubernetes</text>
  <text x="128" y="332" fill="#C7D3E3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">VERSION 1  |  LOCAL DELIVERY WITH KIND</text>
  <g transform="translate(1240 130)">
