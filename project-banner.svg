<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">End-to-End CI/CD Pipeline — Version 1</title>
  <desc id="desc">A dark navy and gold banner for a local Jenkins, Docker and Kind Kubernetes CI/CD project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1426"/><stop offset="0.58" stop-color="#132644"/><stop offset="1" stop-color="#1B3556"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5D98A"/><stop offset="1" stop-color="#C99432"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#D5A94A" stop-opacity=".25"/><stop offset="1" stop-color="#D5A94A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1390" cy="70" r="360" fill="url(#glow)"/>
  <path d="M0 345 C280 270 480 430 760 345 S1260 275 1600 340" fill="none" stroke="#D5A94A" stroke-opacity=".22" stroke-width="2"/>
  <path d="M0 370 C300 300 500 455 820 370 S1300 300 1600 365" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
